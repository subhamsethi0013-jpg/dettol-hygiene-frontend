<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | Dettol Hygiene</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="index.html">Dettol <span>Hygiene</span></a><button class="menu-button" aria-label="Open navigation">☰</button><div class="nav-links"><a href="index.html">Home</a><a href="products.html">Products</a><a href="index.html#about">About</a><a class="active" href="contact.html">Contact</a><a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a></div></div></nav><main><header class="page-header"><div class="container"><h1>Get in Touch</h1><p>We would love to hear from you.</p></div></header><div class="contact-wrap"><form id="contact-form" class="contact-form"><label for="name">Name</label><input class="input" id="name" required><label for="email">Email</label><input class="input" id="email" type="email" required><label for="message">Message</label><textarea class="input" id="message" required></textarea><button class="button" type="submit">Send Message</button><p id="form-status" class="form-status"></p></form></div></main><footer><p>© 2026 Dettol Hygiene Demo. Educational project — not an official Dettol website.</p></footer><script src="js/script.js"></script><script>document.getElementById('contact-form').addEventListener('submit', async function(event) { event.preventDefault(); const status = document.getElementById('form-status'); status.textContent = 'Sending...'; status.className = 'form-status'; try { const response = await fetch(`${API_URL}/contact`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: document.getElementById('name').value, email: document.getElementById('email').value, message: document.getElementById('message').value }) }); const data = await response.json(); if (!response.ok) throw new Error(data.message); status.textContent = data.message; status.className = 'form-status success'; this.reset(); } catch (error) { status.textContent = error.message || 'Could not send your message.'; status.className = 'form-status error'; } });</script></body></html>
